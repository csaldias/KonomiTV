
name: Publish Docker Image

# master ブランチ・feature/ 以下のブランチに変更があったとき or タグが作成されたとき or 手動実行
on:
  push:
    branches:
      - master
      - 'feature/**'
    tags:
      - '*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ジョブの定義
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # 最新コミットがリリースコミットのときは、タグの push がトリガーのとき以外は実行しない
    ## タグが push された後でないと Releases からサードパーティーライブラリをダウンロードできず失敗する
    if: (startsWith(github.ref, 'refs/tags/v')) || (contains(github.event.head_commit.message, 'Release:') == false)
    permissions:
      contents: read
      packages: write
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # タグの push がトリガーのときだけ、Release のサードパーティーライブラリが確実にアップロードされるまで1分ほど待つ
      - name: Wait for Release to be Created
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sleep 60s

      # GitHub Container Registry (ghcr.io) にログイン
      - name: Login to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker イメージのタグ付け用のメタデータを抽出
      - name: Extract Metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # デフォルトブランチは latest、タグはタグ名、それ以外のブランチはブランチ名 (例: feature-epg-translation) でタグ付けする
          ## ブランチ名のタグがないと、feature/ 以下のブランチや手動実行でビルドしたときにタグが1つも生成されず、push に失敗する
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=branch,enable=${{ github.ref_name != github.event.repository.default_branch }}

      # Docker イメージをビルドして公開
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # おそらく使われることのない、Untagged なイメージをすべて削除する
      # ref: https://github.com/vlaurin/action-ghcr-prune
      ## 削除用のトークン (DELETE_GHCR_IMAGES_TOKEN) は本家リポジトリにのみ登録されているため、本家リポジトリでのみ実行する
      - name: Prune Untagged Docker Images
        if: github.repository == 'tsukumijima/KonomiTV'
        uses: vlaurin/action-ghcr-prune@v0.6.0
        with:
          token: ${{ secrets.DELETE_GHCR_IMAGES_TOKEN }}
          container: konomitv
          dry-run: false
          prune-untagged: true
